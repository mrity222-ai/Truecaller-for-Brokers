name: realestate_mobile_app
description: "AI-Powered Real Estate CRM with On-Device Call Intelligence and Floating Overlay."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design Icons
  cupertino_icons: ^1.0.6

  # State Management
  flutter_riverpod: ^2.5.1

  # Local-First SQLite Database (Drift)
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0

  # Truecaller-like Floating Call Overlay
  flutter_overlay_window: ^0.5.0

  # Android Runtime Permissions
  permission_handler: ^11.3.0

  # Offline Sync & REST API Client
  dio: ^5.4.1

  # Data Utilities
  uuid: ^4.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  drift_dev: ^2.16.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/ai_models/
    - assets/icons/
    - assets/images/
